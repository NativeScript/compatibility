# Sketch: builds a minimal app against a matrix of toolchain and runtime
# versions and records successes in data/verified.json. Each successful job
# is one "verified" cell on compatibility.nativescript.org.
name: compat-check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  ios:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.3"]
        runtime: ["9.1.0", "9.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
      - name: Create and build the compat app
        run: |
          npm install -g nativescript
          ns create compat --tsc --no-analytics
          cd compat
          npm install @nativescript/ios@${{ matrix.runtime }} --save-dev
          ns build ios
      - name: Record result
        if: success()
        run: |
          node scripts/report-verification.mjs @nativescript/ios ${{ matrix.runtime }} xcode ${{ matrix.xcode }} \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-ios-${{ matrix.xcode }}-${{ matrix.runtime }}
          path: data/verified.json

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ["17", "21"]
        compileSdk: ["35", "36"]
        runtime: ["9.1.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the SDK platform under test
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-${{ matrix.compileSdk }}" "build-tools;${{ matrix.compileSdk }}.0.0"
      - name: Create and build the compat app
        run: |
          npm install -g nativescript
          ns create compat --tsc --no-analytics
          cd compat
          npm install @nativescript/android@${{ matrix.runtime }} --save-dev
          ns build android --compileSdk ${{ matrix.compileSdk }}
      - name: Record result
        if: success()
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node scripts/report-verification.mjs @nativescript/android ${{ matrix.runtime }} jdk ${{ matrix.jdk }} "$RUN"
          node scripts/report-verification.mjs @nativescript/android ${{ matrix.runtime }} compileSdk ${{ matrix.compileSdk }} "$RUN"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-android-${{ matrix.jdk }}-${{ matrix.compileSdk }}-${{ matrix.runtime }}
          path: data/verified.json

  # A follow-up job would download every artifact, merge the results and open a
  # PR against data/verified.json; merging that PR redeploys the Worker.
